<dialog id="who" aria-labelledby="who-title">
  <form id="whoform" method="dialog" style="display:grid;gap:12px;padding:20px">
    <h3 id="who-title">Who's using this?</h3>
    <p class="note">Your name goes on the changes you make, so everyone can see who did what. This device will remember it.</p>
    <label>Your name<input id="who-name" maxlength="40" required autocomplete="given-name"></label>
    <div class="factions"><div></div><div><button type="submit" class="btn">Continue</button></div></div>
  </form>
</dialog>
